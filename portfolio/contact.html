<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact me through the website contact form.">
    <title>Contact Me</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <h1>Contact Me</h1>
    </header>

<main>
    <section>
        <h2>Get In Touch</h2>

        <form action="#" method="post">
            <div>
                <label for="name">Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    autocomplete="name"
                    required
                >
            </div>

            <div>
                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >
            </div>

            <div>
                <label for="subject">Subject:</label>
                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="Enter a subject"
                    required
                >
            </div>

            <div>
                <label for="message">Message:</label>
                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Enter your message"
                    required
                ></textarea>
            </div>

            <button type="submit">Send</button>
        </form>
    </section>
</main>

<footer class="footer">
    <p>
        Contact me at
        <a href="mailto:jimmy420cpt@gmail.com">jimmy420cpt@gmail.com</a>
    </p>
</footer>

</body>
</html>
